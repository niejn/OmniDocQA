[project]
name = "rag-api"
version = "0.1.0"
description = "文档解析、向量化、混合检索与问答 API"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.4",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "langchain>=0.2.14",
    "langchain-core>=0.2",
    "langchain-openai>=0.1.22",
    "langchain-text-splitters>=0.3",
    "llama-index-core>=0.12",
    "langgraph>=0.2.6",
    "langfuse>=4.0,<5.0",
    # PyPI 0.4.3 (latest): eager vertexai import crashes with
    # langchain-community>=0.4 — tools/ragas_compat.py stubs it at import
    # time (upstream PR #2769 unmerged; its commit lives on a fork, so no git
    # pin is fetchable). Drop the stub once ragas>=0.4.4 releases.
    "ragas>=0.4.3",
    "sentence-transformers>=4.1.0",
    "transformers>=4.51.0",
    "bitsandbytes>=0.46.0",
    "accelerate>=1.6.0",
    "loguru>=0.7",
    "asyncpg>=0.29",
    "openai>=1.0",
    "numpy>=1.26",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "chardet>=5.2",
    "opencc-python-reimplemented>=0.1.7",
    "modelscope>=1.39.1",
    # Local CUDA wheels stay OUT of version control (a file:///C:/... pin broke
    # every CI run — Linux runners can't see Windows paths). Windows gets its
    # GPU torch via the offline install skill; markers keep PyPI's CPU-only
    # Windows build from ever touching this machine's venv.
    "torch>=2.12.1; sys_platform != 'win32'",
    "torchvision>=0.27.1; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "ruff>=0.6", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=73", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/agent"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src/agent"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src/agent"]
testpaths = ["tests/unit_tests"]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]
